<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DDflix</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <a href="#/" class="logo">DDFLIX</a>
  <nav><a href="#/">Acasă</a><a href="#/series">Seriale</a><a href="#/movies">Filme</a><a href="#/search">Caută</a><a href="#/downloads">Descărcări</a></nav>
</header>
<main id="app"></main>
<div id="player" hidden>
  <video id="vid" playsinline controls></video>
  <div class="pbar">
    <button id="pclose" aria-label="Închide">✕</button>
    <span id="ptitle"></span>
    <select id="paudio" aria-label="Audio"></select>
    <select id="psub" aria-label="Subtitrare"></select>
  </div>
  <div class="pseek"><span id="pcur">0:00</span><input id="pscrub" type="range" min="0" max="100" value="0" step="1" aria-label="Poziție"><span id="pdur">0:00</span></div>
</div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
