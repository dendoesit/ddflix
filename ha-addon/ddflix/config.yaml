name: DDflix
version: "1.17.2"
slug: ddflix
description: Netflix local - seriale/filme de pe NAS, căutare + descărcare FileList, qBittorrent inclus
url: https://github.com/dendoesit/ddflix
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
host_network: true
ports:
  8090/tcp: 8090
  8091/tcp: 8091
  8443/tcp: 8443
  8080/tcp: 8080
  6881/tcp: 6881
  6881/udp: 6881
ports_description:
  8090/tcp: DDflix (televizoare + admin, doar rețeaua de acasă)
  8091/tcp: DDflix public (prin Tailscale Funnel, doar cu parolă)
  8443/tcp: DDflix direct HTTPS (port deschis pe router, certificat DuckDNS, doar cu parolă)
  8080/tcp: qBittorrent Web UI
  6881/tcp: BitTorrent
  6881/udp: BitTorrent
map:
  - media:rw
  - ssl:ro
options:
  media_dir: /media/nas
  download_dir: /media/nas
  filelist_user: ""
  filelist_rss_url: ""
  rss_mode: follow
  web_password: ""
  tmdb_key: ""
  remote_access: true
  web_url: http://192.168.1.156:8090
  lan_cidr: 192.168.1.0/24
schema:
  media_dir: str
  download_dir: str
  filelist_user: str
  filelist_rss_url: password
  rss_mode: list(follow|all)
  web_password: password
  tmdb_key: password
  remote_access: bool
  web_url: str
  lan_cidr: str
