# BubuFlix pe NAS: serverul pentru TV + qBittorrent. Toate setările personale sunt în .env (copiat din .env.example).
#   docker compose up -d --build
services:
  bubuflix:
    build: ./server
    container_name: bubuflix
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      MEDIA_DIR: /media
      QBT_URL: http://qbittorrent:8080
      QBT_SAVE_PATH: /media/downloads
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8090:8090"          # TV-urile și pagina de admin (doar în rețeaua de acasă, NU deschide portul în router)
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${MEDIA_PATH:?seteaza MEDIA_PATH in .env}:/media:ro
    tmpfs:
      - /tmp
    depends_on:
      - qbittorrent

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.0.4
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Bucharest}
      WEBUI_PORT: 8080
      TORRENTING_PORT: ${TORRENT_PORT:-6881}
    volumes:
      - ${QBT_CONFIG_PATH:-./qbittorrent}:/config
      - ${MEDIA_PATH:?seteaza MEDIA_PATH in .env}:/media
    ports:
      - "8080:8080"                                   # interfața web qBittorrent
      - "${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}"
      - "${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}/udp"
